# ship.conf (harbor#1018) — harbor's opt-in to unattended merge and deploy (the ship contract §1, §6; the policy
# and the CLI: docs/design/approval-gate.md). Commands run from the main checkout through sh -c. Always protected.
repo VytCepas/harbor
# the workflow whose runs a PR merge judges: public-ci.yml, since governance.yml is disabled and CI runs on the public
# mirror (harbor#1149). A name that never runs refuses every merge with "no CI run".
workflow public-ci.yml
# merge commits keep the operator as author of every commit the App merges (harbor#1018)
method merge-commit
protected .agents/protected-paths.tsv
plan sh bin/deploy.sh --live
apply sh bin/deploy.sh --apply --live --unattended
verify sh bin/floor-verify.sh --live
verify sh bin/deploy-live-verify.sh --live
verify sh bin/drift-reference-check.sh --live
restore sh bin/deploy-restore.sh --apply --live --from "$SHIP_SNAPSHOT_ID" --accept-loss
# the commit the live install is at, which deploy-restore.sh puts back with the snapshot: the runner trusts its recorded sha only
# while this agrees (deploy-fleet.md, "What is read where")
deployed awk '$1 == "floor-install" { print $2; exit }' "${CLAUDE_CONFIG_DIR:-$HOME/.claude}/.helm-install-stamp"
