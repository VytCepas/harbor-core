<!doctype html>
<!-- intake-live.html — the page tests/access/chrome/intake-live.sh drives: a vendor-style "key shown once" dialog.
     Create fills the dialog; Copy & Close copies the key with navigator.clipboard.writeText (execCommand as the fallback)
     and closes the dialog, as RTB House's did on 2026-11-23. The key is a fixed fake, so the probe can compare the store. -->
<html lang="en">
<head><meta charset="utf-8"><title>intake live probe</title></head>
<body>
<h1>API keys</h1>
<button id="create" type="button">Create</button>
<div id="dlg" role="dialog" aria-label="Your new key" hidden>
  <label>API key <input id="key" readonly></label>
  <button id="copy" type="button">Copy &amp; Close</button>
</div>
<p id="status">no key yet</p>
<script>
const KEY = 'fake-live-key-' + '0123456789abcdef';
document.getElementById('create').onclick = () => {
  document.getElementById('key').value = KEY;
  document.getElementById('dlg').hidden = false;
};
document.getElementById('copy').onclick = async () => {
  let how = 'clipboard api';
  try { await navigator.clipboard.writeText(KEY); }
  catch (e) { const k = document.getElementById('key'); k.select(); how = document.execCommand('copy') ? 'execCommand' : 'no copy'; }
  document.getElementById('dlg').hidden = true;
  document.getElementById('status').textContent = 'copied by ' + how + ', dialog closed';
};
</script>
</body>
</html>
